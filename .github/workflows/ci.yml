name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate
      - run: pnpm validate:publication
      - run: pnpm grok doctor
      - run: pnpm audit --prod --audit-level=high
      - name: Ensure no private state was added
        run: git diff --exit-code -- . ':(exclude)generated/**' ':(exclude)state/**'
