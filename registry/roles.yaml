# GrokBot workforce registry — 134 roles, encoded as data.
# id/name/title(optional)/domain/priority/tier/parent/mission/activation are
# author-authored. budgetClass/maxHandoffs/approvalBoundary/dataClass/
# allowedPeers/groupCandidates/routineCandidates/tags are DERIVED (see
# src/registry.ts and config/*). parent is a role name or an anchor:
#   human  -> the principal (ChiefOfStaff reports here)
#   agentos -> owned by the AgentOS execution system, reports via ChiefOfStaff
#   orgos   -> owned by the OrgOS coordination system, reports via ChiefOfStaff
# identityPersistent/runtimePreference (optional, roles 133-134) are semantic
# annotations only — they never create, activate, or materialize a bot.
# This file defines roles only. No GrokBot is created or activated by it.

anchors:
  - id: human
    name: human
    parent: null
    note: "The principal. End of every escalation chain; source of approval for irreversible/external/financial/legal/security actions."
  - id: agentos
    name: agentos
    parent: ChiefOfStaff
    note: "AgentOS execution control plane owns these experiments; outcomes fold back to ChiefOfStaff."
  - id: orgos
    name: orgos
    parent: ChiefOfStaff
    note: "OrgOS organizational coordination owns these simulations; outcomes fold back to ChiefOfStaff."

