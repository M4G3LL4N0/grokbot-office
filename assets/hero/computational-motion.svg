<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="request to candidate routes to policy select. requests arrive, candidates narrow, one route is selected.">
<title>GrokBot Office — computational sequence</title>
<desc>A state machine showing the real transition this system performs: request then candidate routes then policy select. Derived from the project architecture, not decorative.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<rect width="960" height="300" fill="#0a0d12"/>
<text x="60" y="52" fill="#f4efe44f" font-size="11.5" letter-spacing="2.6">ROUTER · SECURITY</text>
<text x="60" y="80" fill="#f4efe4" font-size="19" font-weight="620" letter-spacing="-0.2">requests arrive, candidates narrow, one route is selected</text>
<rect x="60.0" y="128" width="262.6666666666667" height="54" rx="10" fill="#f4efe4" fill-opacity="0.05" stroke="#f4efe424" stroke-width="1.2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.40s" fill="freeze"/></rect>
<rect x="60.0" y="128" width="3" height="54" rx="1.5" fill="#f4efe4" opacity="0"><animate attributeName="opacity" from="0" to="0.9" dur="0.5s" begin="0.40s" fill="freeze"/></rect>
<text x="191.33333333333334" y="161" fill="#f4efe4" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" opacity="0">request<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.58s" fill="freeze"/></text>
<line x1="322.6666666666667" y1="155.0" x2="348.6666666666667" y2="155.0" stroke="#f4efe424" stroke-width="1.2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.70s" fill="freeze"/><animate attributeName="stroke" values="#f4efe424;#9d8bd6;#f4efe424" dur="6s" repeatCount="indefinite"/></line>
<rect x="348.6666666666667" y="128" width="262.6666666666667" height="54" rx="10" fill="#f4efe4" fill-opacity="0.05" stroke="#9d8bd6" stroke-width="1.2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.95s" fill="freeze"/></rect>
<rect x="348.6666666666667" y="128" width="3" height="54" rx="1.5" fill="#9d8bd6" opacity="0"><animate attributeName="opacity" from="0" to="0.9" dur="0.5s" begin="0.95s" fill="freeze"/></rect>
<text x="480.0" y="161" fill="#f4efe4" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" opacity="0">candidate routes<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.13s" fill="freeze"/></text>
<line x1="611.3333333333334" y1="155.0" x2="637.3333333333334" y2="155.0" stroke="#f4efe424" stroke-width="1.2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.25s" fill="freeze"/><animate attributeName="stroke" values="#f4efe424;#9d8bd6;#f4efe424" dur="6s" repeatCount="indefinite"/></line>
<rect x="637.3333333333334" y="128" width="262.6666666666667" height="54" rx="10" fill="#f4efe4" fill-opacity="0.05" stroke="#f4efe424" stroke-width="1.2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.50s" fill="freeze"/></rect>
<rect x="637.3333333333334" y="128" width="3" height="54" rx="1.5" fill="#e7c27a" opacity="0"><animate attributeName="opacity" from="0" to="0.9" dur="0.5s" begin="1.50s" fill="freeze"/></rect>
<text x="768.6666666666667" y="161" fill="#f4efe4" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" opacity="0">policy select<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.68s" fill="freeze"/></text>
<circle r="3.6" fill="#9d8bd6" opacity="0.9"><animateMotion dur="2.6s" fill="freeze" path="M191 112 L769 112"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="2.6s" fill="freeze"/></circle>
<text x="60" y="118" fill="#f4efe44f" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">traversal</text>
</svg>